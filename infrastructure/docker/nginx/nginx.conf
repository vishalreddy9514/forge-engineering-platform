# The single origin of the containerised stack (the ALB plays this role in AWS):
#   /api/*  → api   (NestJS)        everything else → web (Next.js)
# The AI service has no route here: only the API and the worker can reach it.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # Writable paths for the unprivileged user.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s '
                  'upstream=$upstream_addr ${upstream_response_time}s rid=$request_id';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Docker's DNS, so containers that restart with a new address are found again.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api {
    server api:4000;
    keepalive 16;
  }
  upstream web {
    server web:3000;
    keepalive 16;
  }

  server {
    listen 8080;

    # Documents are sent as JSON up to 1 MB; GitHub webhooks up to 5 MB. Attachments never pass
    # through here: browsers upload them straight to object storage with pre-signed URLs.
    client_max_body_size 6m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location /api/ {
      proxy_pass http://api;
      # AI drafts and chat stream as Server-Sent Events: pass each event on immediately.
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
