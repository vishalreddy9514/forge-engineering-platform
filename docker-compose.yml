# Infrastructure for local development: `pnpm infra:up`, then run the apps on the host with
# `pnpm dev` (hot reload).
#
# The whole product in containers, from the production images, behind Nginx on
# http://localhost:8080: `pnpm stack:up` (the `app` profile below). See docs/docker.md.
name: forge

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-forge}
      # Password for the AI service's least-privilege login (init/02-ai-service-role.sh).
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-forge_ai_dev_password}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.10-alpine
    # AOF persistence so queued jobs survive a container restart, as they would in ElastiCache.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    # Catches all outgoing email locally; web UI on http://localhost:8025.
    image: axllent/mailpit:v1.31
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  object-storage:
    # S3-compatible object storage for attachments (AWS S3 in deployed environments). The app
    # only speaks the S3 API through the AWS SDK, so nothing is SeaweedFS-specific. The API
    # creates the bucket and its CORS rule on startup when S3_ENSURE_BUCKET=true.
    image: chrislusf/seaweedfs:3.97
    command:
      - server
      - -dir=/data
      - -volume.max=10
      # Small volume files without preallocation: the defaults reserve 1 GB per file and create
      # seven at once for a new bucket, so one upload took about 7 GB of disk.
      - -master.volumeSizeLimitMB=64
      - -master.volumePreallocate=false
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333'
    volumes:
      - object-data:/data
      - ./infrastructure/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/status']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # Application (profile `app`): the production images, wired the way they run in AWS.
  # ---------------------------------------------------------------------------------------------

  migrate:
    profiles: [app]
    build: &api-build
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
      secrets: [build_ca]
    image: forge-migrate:local
    # Migrations run as the schema owner. Then db-logins.ts creates (or updates) the
    # least-privilege login the API and worker use. `pnpm stack:seed` loads the demo data.
    command: ['sh', '-c', 'prisma migrate deploy && tsx prisma/db-logins.ts']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge_dev_password}@postgres:5432/${POSTGRES_DB:-forge}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-forge_app_dev_password_local_only}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    profiles: [app]
    build:
      <<: *api-build
      target: runtime
    image: forge-api:local
    env_file: &app-env
      - path: .env
        required: false
      # JWT keys and the AI service token, generated by `pnpm stack:up` (stack-env.mjs).
      - path: infrastructure/docker/.stack.env
        required: false
    environment: &api-env
      # The end-to-end run in CI starts the same images with STACK_NODE_ENV=test,
      # STACK_RATE_LIMITS_ENABLED=false (rate limits cannot be turned off in production) and
      # STACK_HIBP_ENABLED=false (the suite's fixed password is a known breached one, and the
      # run must not depend on an outside service).
      NODE_ENV: ${STACK_NODE_ENV:-production}
      RATE_LIMITS_ENABLED: ${STACK_RATE_LIMITS_ENABLED:-true}
      HIBP_ENABLED: ${STACK_HIBP_ENABLED:-true}
      LOG_PRETTY: 'false'
      LOG_LEVEL: ${LOG_LEVEL_STACK:-info}
      # Rows only: no DDL, an insert-only audit log (the forge_app role, Phase 18).
      DATABASE_URL: postgresql://forge_app_service:${APP_DB_PASSWORD:-forge_app_dev_password_local_only}@postgres:5432/${POSTGRES_DB:-forge}
      REDIS_URL: redis://redis:6379
      # Behind Nginx: req.ip is the browser's address, from X-Forwarded-For.
      TRUST_PROXY_HOPS: '1'
      WEB_ORIGIN: &origin http://localhost:${APP_PORT:-8080}
      CORS_ORIGINS: *origin
      # Secure cookies work over plain HTTP on localhost, which browsers treat as secure.
      COOKIE_SECURE: 'true'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      S3_ENDPOINT: http://object-storage:8333
      # Pre-signed upload URLs must be reachable from the browser, not just from the API.
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-8333}
      S3_FORCE_PATH_STYLE: 'true'
      S3_ENSURE_BUCKET: 'true'
      AI_SERVICE_URL: http://ai-service:8000
      API_INTERNAL_URL: http://api:4000
      # Prometheus metrics, reachable on the compose network only (no published port).
      METRICS_PORT: '9464'
    depends_on: &api-depends
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      object-storage: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      ai-service: { condition: service_healthy }
    restart: unless-stopped

  worker:
    profiles: [app]
    image: forge-api:local
    command: ['node', 'dist/worker.js']
    env_file: *app-env
    environment: *api-env
    depends_on:
      <<: *api-depends
      api: { condition: service_healthy }
    # No HTTP port: liveness is the process itself (the ECS task restarts it if it exits). The
    # check replaces the image's API probe, and gives `up --wait` something to wait on: Compose
    # v2 refuses to wait for a service whose healthcheck is disabled.
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.kill(1, 0)']
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  ai-service:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
      secrets: [build_ca]
    image: forge-ai-service:local
    env_file: *app-env
    environment:
      NODE_ENV: production
      AI_LOG_JSON: 'true'
      METRICS_PORT: '9464'
      AI_DATABASE_URL: postgresql://forge_ai_service:${AI_DB_PASSWORD:-forge_ai_dev_password}@postgres:5432/${POSTGRES_DB:-forge}
    # No published port: only the API and the worker reach it, on the compose network.
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets: [build_ca]
    image: forge-web:local
    environment:
      # The CSP lets browsers upload here only: the pre-signed URLs point at object storage.
      STORAGE_ORIGIN: http://localhost:${S3_PORT:-8333}
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  proxy:
    profiles: [app]
    image: nginx:1.29-alpine
    user: '101:101'
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/api/v1/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- Observability (docker compose --profile app --profile observability up) ----
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.7.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.2.0
    environment:
      # Local only: anyone on this machine may view; signing in as admin is for editing.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-forge_dev_grafana}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/forge-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_healthy }
    restart: unless-stopped

secrets:
  # Optional: an extra CA certificate for builds behind a TLS-intercepting proxy
  # (BUILD_CA_CERT=/path/to/ca.pem). Empty by default, and then unused. The default is an empty
  # file in the repository, not /dev/null: newer buildx refuses to read files outside the project
  # without an --allow=fs.read entitlement.
  build_ca:
    file: ${BUILD_CA_CERT:-./infrastructure/docker/no-build-ca.pem}

volumes:
  prometheus-data:
  postgres-data:
  redis-data:
  object-data:
