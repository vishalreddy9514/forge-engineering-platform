# Local development dependencies. Start with `pnpm infra:up`, then run the apps with `pnpm dev`.
# Application containers (web, api, worker, ai-service) and the Nginx proxy are added in
# Phase 14, when production Dockerfiles exist; until then apps run on the host with hot reload.
name: forge

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-forge}
      # Password for the AI service's least-privilege login (init/02-ai-service-role.sh).
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-forge_ai_dev_password}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # AOF persistence so queued jobs survive a container restart, as they would in ElastiCache.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    # Catches all outgoing email locally; web UI on http://localhost:8025.
    image: axllent/mailpit:v1.31
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
