# Prometheus for the containerised stack (docker compose --profile app --profile observability).
# Every service serves /metrics on port 9464, which no proxy routes (docs/observability.md).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: forge-api
    static_configs:
      - targets: ['api:9464']
  - job_name: forge-worker
    static_configs:
      - targets: ['worker:9464']
  - job_name: forge-ai-service
    static_configs:
      - targets: ['ai-service:9464']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
