name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch/PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Python checks run in their own job; this job does not install uv.
      TURBO_FILTER: '--filter=!@forge/ai-service'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck $TURBO_FILTER
      - run: pnpm turbo run test $TURBO_FILTER
      - run: pnpm turbo run build $TURBO_FILTER

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/ai-service/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  compose:
    name: Docker Compose (config + dependencies healthy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --detach --wait --wait-timeout 120
      - name: Postgres extensions installed by the init script
        run: |
          docker compose exec -T postgres psql -U forge -d forge -tAc \
            "select count(*) from pg_extension where extname in ('vector','pg_trgm','citext')" \
            | grep -qx 3
      - if: always()
        run: docker compose down --volumes
