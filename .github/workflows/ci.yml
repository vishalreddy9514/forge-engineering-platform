name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch/PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to a full commit SHA (the tag in the comment is for people and for
# Dependabot, which keeps both up to date): a moved tag cannot change what runs here.

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Python checks run in their own job; this job does not install uv.
      TURBO_FILTER: '--filter=!@forge/ai-service'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck $TURBO_FILTER
      - run: pnpm turbo run test $TURBO_FILTER
      - run: pnpm turbo run build $TURBO_FILTER

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.0
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Every commit is free of secrets (allowlist in .gitleaks.toml)
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  python:
    name: Python (ruff, mypy, pytest, retrieval eval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ai-service
    # Retrieval tests and the FR-8.6 eval run against real pgvector, the same image as compose.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_ci_password
          POSTGRES_DB: forge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forge" --health-interval 2s --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://forge:forge_ci_password@localhost:5432/postgres
      # Database tests fail instead of skipping if the service above is missing.
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/ai-service/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  terraform:
    name: Terraform (fmt, validate, test, misconfiguration scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Validate every root (no backend, no credentials)
        run: |
          for root in bootstrap environments/dev environments/prod modules/stack; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done
      - name: Plan tests with a mocked AWS provider
        run: terraform -chdir=modules/stack test
      - name: Misconfiguration scan (fails on High and Critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          severity: HIGH,CRITICAL
          exit-code: '1'

  observability:
    name: Observability config (promtool, dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prometheus config and alert rules are valid
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.7.2 check config /etc/prometheus/prometheus.yml
      - name: Alert rules behave as specified (promtool test rules)
        run: |
          docker run --rm --entrypoint promtool -w /rules \
            -v "$PWD/observability/prometheus:/rules:ro" \
            prom/prometheus:v3.7.2 test rules alerts.test.yml
      - name: Dashboard is valid JSON and queries only metrics the services export
        run: python3 observability/check_dashboard.py

  compose:
    name: Docker Compose (bootstrap, migrate, seed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://forge:forge_dev_password@localhost:5432/forge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --detach --wait --wait-timeout 120
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to the compose database (as a deployment would)
        run: pnpm --filter @forge/api exec prisma migrate deploy
      - name: Schema matches migrations (no drift)
        run: >
          pnpm --filter @forge/api exec prisma migrate diff
          --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed, then confirm a second run is a no-op
        run: |
          pnpm --filter @forge/api exec prisma db seed
          pnpm --filter @forge/api exec prisma db seed | grep -q 'already has data'
      - name: AI service role can reach RAG tables but not user data
        run: |
          export PGPASSWORD=forge_ai_dev_password
          docker compose exec -T -e PGPASSWORD postgres \
            psql -h localhost -U forge_ai_service -d forge -tAc 'select count(*) from documents'
          ! docker compose exec -T -e PGPASSWORD postgres \
            psql -h localhost -U forge_ai_service -d forge -tAc 'select count(*) from users'
      - if: always()
        run: docker compose down --volumes

  e2e:
    name: End-to-end on the containers (Playwright, axe, ZAP, k6)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      # The production images, with rate limits and the breached-password lookup off for the
      # browser suite, as in its local launcher (see docs/testing.md).
      STACK_NODE_ENV: test
      STACK_RATE_LIMITS_ENABLED: 'false'
      STACK_HIBP_ENABLED: 'false'
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: cp .env.example .env
      - name: Build the images
        run: docker compose --profile app build
      - name: Start the stack (migrations run first, as a one-shot job)
        run: pnpm stack:up
      - name: Seed demo data inside the migrate image
        run: pnpm stack:seed
      - run: pnpm install --frozen-lockfile --filter @forge/e2e...
      - run: pnpm --filter @forge/e2e exec playwright install --with-deps chromium
      - name: Every journey, through Nginx on the production images
        run: pnpm e2e
      # OWASP ZAP's passive baseline (NFR-6) against the same stack: headers, cookies, CSP,
      # information leaks. Any warning fails the build unless .zap/rules.tsv ignores it, with a
      # reason. The image is pinned by digest.
      - name: ZAP baseline scan
        if: success() || failure()
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R a+rwX zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            zaproxy/zap-stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py -t http://localhost:8080 -m 2 -c rules.tsv -r zap-report.html -J zap-report.json
      - name: ZAP report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: zap/zap-report.*
          retention-days: 14
      # Load tests against 100k issues on the same images (NFR-1, NFR-3): the thresholds in the
      # scripts fail the build. Short runs on a shared runner, so a regression gate with wide
      # margins rather than the reference measurement (docs/performance.md).
      - name: Performance dataset (100k issues)
        run: pnpm stack:perf-seed
      - name: Load tests (k6)
        run: |
          mkdir -p perf-results && chmod a+rwX perf-results
          for script in crud issue-list; do
            docker run --rm --network host -v "$PWD/perf:/perf:ro" -v "$PWD/perf-results:/out" \
              -e DURATION=30s \
              grafana/k6@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d \
              run --quiet --summary-export "/out/$script.json" "/perf/$script.js"
          done
      - name: k6 summaries
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-summaries
          path: perf-results/
          retention-days: 14
      - name: Image sizes
        if: always()
        run: docker images --filter reference='forge-*' --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - if: failure()
        run: docker compose --profile app logs --no-color > stack.log
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure
          path: |
            e2e/playwright-report
            stack.log
          retention-days: 7
      - if: always()
        run: docker compose --profile app down --volumes
